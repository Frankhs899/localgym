# LocalGym CI (issue #2): runs on pushes and PRs to dev and main.
# Branch strategy: see README (Estrategia de ramas).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# One in-flight run per ref: a superseded push/PR cancels the older run
# of that ref instead of piling up duplicate runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job ids double as check-run names; the required status checks on main
  # reference them exactly ("backend", "frontend"), so no display names.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14.8
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        # config/settings.py reads LOCALGYM_SECRET_KEY with no default
        # (fail-closed by design): tests need a throwaway key. It only
        # signs sessions of ephemeral CI runs — it is not a secret.
        run: python manage.py test
        env:
          LOCALGYM_SECRET_KEY: dummy-key-for-ci-not-a-real-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # pnpm version comes from the packageManager field (10.33.2); the
      # action looks at the repo root by default, so point it at frontend/.
      # Must run before setup-node: its pnpm cache needs the binary.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node 24.21.0
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint
